 <text x="909" y="377" text-anchor="middle" fill="#c3dce9" font-size="21">USB · read-only ADB</text>
 <text x="909" y="410" text-anchor="middle" fill="#96bed6" font-size="18">Screenshot → model</text>
 <rect x="785" y="575" width="236" height="191" rx="23" fill="#193c37" stroke="#82e7bc" stroke-width="2"/>
 <rect x="806" y="597" width="194" height="147" rx="12" fill="#122a2a"/>
 <rect x="867" y="613" width="72" height="56" rx="6" fill="#8da8ac"/>
 <path d="M822 615V721M984 615V721" stroke="#7dc4a5" stroke-width="6" stroke-dasharray="5 10"/>
 <text x="903" y="703" text-anchor="middle" fill="#c5ffe7" font-size="24" font-weight="bold">ESP32-S3</text>
 <text x="903" y="732" text-anchor="middle" fill="#a4cabb" font-size="16">UART → Bluetooth HID</text>
 <path d="M704 649H766" stroke="#83f2c3" stroke-width="4" marker-end="url(#ag)"/>
 <text x="738" y="610" text-anchor="middle" fill="#b6e7d2" font-size="17">USB</text>
 <path d="M1037 677H1100" stroke="#83f2c3" stroke-width="4" marker-end="url(#ag)"/>
 <text x="1068" y="633" text-anchor="middle" fill="#b6e7d2" font-size="17">BLE</text>
 <text x="905" y="821" text-anchor="middle" fill="#90efc6" font-size="24" font-weight="bold">2. DECIDE → 3. MOVE / CLICK</text>
 <line x1="70" y1="896" x2="1530" y2="896" stroke="#35526a"/>
 <text x="73" y="940" fill="#edf7ff" font-size="23" font-weight="bold">Read-only ADB by default</text><text x="585" y="940" fill="#edf7ff" font-size="23" font-weight="bold">No phone App required</text><text x="1090" y="940" fill="#edf7ff" font-size="23" font-weight="bold">Relative BLE control</text>
 <text x="73" y="982" fill="#a8bfd2" font-size="19">Optional Accessibility mode requires separate authorization. Diagram is conceptual, not a live screen capture.</text>
